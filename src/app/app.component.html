<div class="min-h-screen bg-slate-50">
  <header class="px-6 py-4 bg-white shadow sticky top-0 z-10">
    <h1 class="text-2xl font-semibold">🕵️ get-infos (Scraping Service-Public)</h1>
    <p class="text-sm text-slate-500">Selenium + Express + Angular</p>
  </header>

  <main class="px-6 py-6 max-w-6xl mx-auto">
    <form (ngSubmit)="onSearch()" class="grid md:grid-cols-12 gap-3 items-end">
      <div class="md:col-span-5">
        <label class="block text-sm mb-1">Qui / Quoi *</label>
        <input [(ngModel)]="what" name="what" required
               class="w-full border rounded-xl px-4 py-2 bg-white"
               placeholder="Ex: Peloton motorisé">
      </div>

      <div class="md:col-span-4">
        <label class="block text-sm mb-1">Où (ville ou CP)</label>
        <input [(ngModel)]="where" name="where"
               class="w-full border rounded-xl px-4 py-2 bg-white"
               placeholder="Ex: Paris ou 75001">
      </div>

      <div class="md:col-span-3 flex flex-wrap gap-2">
        <button [disabled]="loading" class="flex-1 rounded-xl px-4 py-2 bg-blue-600 text-white" type="submit">
          {{ loading ? 'Recherche…' : 'Rechercher' }}
        </button>
        <button type="button" (click)="onExportCsv()" [disabled]="!rows.length || loading"
                class="rounded-xl px-4 py-2 bg-emerald-600 text-white">CSV</button>
        <button type="button" (click)="onExportXlsx()" [disabled]="!rows.length || loading"
                class="rounded-xl px-4 py-2 bg-indigo-600 text-white">XLSX</button>
      </div>
    </form>

    <div *ngIf="error" class="mt-4 text-red-600 font-medium">{{error}}</div>

    <div *ngIf="!loading && !error" class="mt-4 text-slate-600">
      <span class="text-sm">Résultats : {{rows.length}} / ~{{total}}</span>
    </div>

    <div class="mt-6 bg-white rounded-2xl shadow overflow-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-100">
          <tr>
            <th class="text-left p-3">Nom</th>
            <th class="text-left p-3">Adresse</th>
            <th class="text-left p-3">Téléphone</th>
            <th class="text-left p-3">Email</th>
            <th class="text-left p-3">Site</th>
            <th class="text-left p-3">Région</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows" class="border-t hover:bg-slate-50">
            <td class="p-3">
              <a [href]="r.url || '#'" target="_blank" class="text-blue-700 underline font-medium">{{r.nom}}</a>
            </td>
            <td class="p-3 whitespace-pre-line">{{r.adresse || '—'}}</td>
            <td class="p-3">
              <a *ngIf="r.telephone" [href]="'tel:'+r.telephone" class="underline text-slate-700">{{r.telephone}}</a>
              <span *ngIf="!r.telephone">—</span>
            </td>
            <td class="p-3">
              <a *ngIf="r.email" [href]="'mailto:'+r.email" class="underline text-slate-700">{{r.email}}</a>
              <span *ngIf="!r.email">—</span>
            </td>
            <td class="p-3">
              <a *ngIf="r.site" [href]="r.site" target="_blank" class="underline text-blue-700">{{r.site}}</a>
              <span *ngIf="!r.site">—</span>
            </td>
            <td class="p-3">{{r.region || '—'}}</td>
          </tr>
          <tr *ngIf="!rows.length && !loading">
            <td colspan="6" class="p-6 text-center text-slate-500">Aucun résultat.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 text-center">
      <button (click)="onMore()" [disabled]="loading || rows.length >= total"
              class="rounded-xl px-4 py-2 bg-slate-700 text-white">
        {{ rows.length >= total ? 'Fin des résultats' : (loading ? 'Chargement…' : 'Voir plus') }}
      </button>
    </div>
  </main>
</div>
